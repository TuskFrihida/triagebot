[project]
name = "triagebot"
version = "0.1.0"
description = "AI triage for website customer inquiries: OpenAI -> Google Sheets -> Telegram"
requires-python = ">=3.10"

# Lower bounds here; requirements.txt pins the exact versions this was built
# and tested against. Install with `pip install -r requirements.txt` for a
# reproducible environment, then `pip install -e .` to make the package
# importable.
dependencies = [
    "openai>=2.0",
    "pydantic>=2.7",
    "gspread>=6.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
